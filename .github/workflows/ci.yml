name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Refresh dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only || true

      - name: Commit refreshed lockfile to the PR branch
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json package.json
            git commit -m "chore: refresh dependency lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const entries=Object.entries(require("./npm-audit.json").vulnerabilities ?? {}); for (const [name,v] of entries) console.log(`${v.severity.toUpperCase()} ${name}: direct=${v.isDirect}, fix=${JSON.stringify(v.fixAvailable)}`); const blocking=entries.filter(([,v]) => v.severity === "high" || v.severity === "critical"); if (blocking.length) { console.error(`Blocking security advisories: ${blocking.map(([name]) => name).join(", ")}`); process.exit(1); }'

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

