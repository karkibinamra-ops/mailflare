name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const entries=Object.entries(require("./npm-audit.json").vulnerabilities ?? {}); for (const [name,v] of entries) console.log(`${v.severity.toUpperCase()} ${name}: direct=${v.isDirect}, fix=${JSON.stringify(v.fixAvailable)}`); const blocking=entries.filter(([,v]) => v.severity === "high" || v.severity === "critical"); if (blocking.length) { console.error(`Blocking security advisories: ${blocking.map(([name]) => name).join(", ")}`); process.exit(1); }'

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then rerun this workflow."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout verified commit
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        if: steps.credentials.outputs.enabled == 'true'
        run: npm ci

      - name: Build OpenNext Worker
        if: steps.credentials.outputs.enabled == 'true'
        run: npx opennextjs-cloudflare build

      - name: Apply D1 migrations
        if: steps.credentials.outputs.enabled == 'true'
        run: npm run db:migrate:remote

      - name: Deploy Worker
        if: steps.credentials.outputs.enabled == 'true'
        run: npm run deploy:worker

