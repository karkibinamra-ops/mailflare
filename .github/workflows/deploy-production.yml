name: Deploy Mailflare to Cloudflare

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mailflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN to repository Actions secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID to repository Actions secrets."; exit 1; }

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build, apply D1 migrations, and deploy Worker
        run: npm run deploy
